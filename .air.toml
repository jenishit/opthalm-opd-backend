[build]
cmd = "go build -o ./tmp/main ./cmd"
entrypoint = "./tmp/main"
watch = ["."]
exclude_dir = ["tmp", "vendor", "node_modules", ".git"]
exclude_file = []
exclude_regex = ["_test\\.go"]
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
kill_delay = "1s"
send_interrupt = true
stop_on_error = false
delay = 1000
