root = "."
tmp_dir = "tmp"

[build]
# default air config builds "" the package in the project root; this module
# keeps main.go in ./cmd, so the build must target it explicitly.
cmd = "go build -o ./tmp/main ./cmd"
entrypoint = ["./tmp/main"]
delay = 1000
stop_on_error = true
send_interrupt = false
kill_delay = "5s"

[log]
time = false

[misc]
clean_on_exit = true
