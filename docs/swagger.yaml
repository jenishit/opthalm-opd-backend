host: localhost:8082
info:
  contact:
    name: API Support
  description: |-
    Backend API for a multi-tenant (SaaS) ophthalmology clinic
    management system: patients, visits, billing/POS, inventory,
    lab jobs, reports, and optical calculators.

    Every route under /api (other than /api/auth/*, /api/signup,
    and the /api/auth/password-reset|email endpoints) requires a
    Bearer access token, and most additionally require the
    caller's clinic to have an active subscription.
  license:
    name: Proprietary
  title: Opthalmic Management System API
  version: "1.0"
paths:
  /admin/catalog/conditions:
    get:
      description: Admin-only. History conditions are a global catalog, not clinic-scoped.
      parameters:
      - default: 10
        description: Max results
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/http.response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.HistoryConditionResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List history conditions
      tags:
      - catalog
  /admin/catalog/conditions/{id}:
    get:
      description: Admin-only.
      parameters:
      - description: Condition ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/http.response'
            - properties:
                data:
                  $ref: '#/definitions/dto.HistoryConditionResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.errorResponse'
      security:
      - BearerAuth: []
      summary: Get a history condition
      tags:
      - catalog
    patch:
      consumes:
      - application/json
      description: Admin-only.
      parameters:
      - description: Condition ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateHistoryConditionReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.response'
      security:
      - BearerAuth: []
      summary: Update a history condition
      tags:
      - catalog
  /admin/catalog/conditions/{id}/delete:
    patch:
      description: Admin-only.
      parameters:
