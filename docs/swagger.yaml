basePath: /api
definitions:
  domain.ConfirmEmailVerificationRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  domain.ConfirmPasswordResetRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  domain.Login:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  domain.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      session_id:
        type: string
      user_id:
        type: string
      user_type:
        type: string
    type: object
  domain.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  domain.RequestPasswordResetRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  domain.Role:
    properties:
      id:
        type: string
      roleName:
        type: string
    type: object
  domain.SignupRequest:
