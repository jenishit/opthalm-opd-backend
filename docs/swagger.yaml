basePath: /api
definitions:
  domain.ConfirmEmailVerificationRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  domain.ConfirmPasswordResetRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  domain.Login:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  domain.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      session_id:
        type: string
      user_id:
        type: string
      user_type:
        type: string
    type: object
  domain.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  domain.RequestPasswordResetRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  domain.Role:
    properties:
      id:
        type: string
      roleName:
        type: string
    type: object
  domain.SignupRequest:
    properties:
      admin_email:
        type: string
      admin_first_name:
        type: string
      admin_last_name:
        type: string
      admin_password:
        type: string
      clinic_name:
        type: string
      registration_no:
        type: string
    required:
    - admin_email
    - admin_first_name
    - admin_last_name
    - admin_password
    - clinic_name
    - registration_no
    type: object
  domain.User:
    properties:
      clinicID:
        type: string
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      password:
        $ref: '#/definitions/valueobjects.Password'
      roleID:
        type: string
      updatedAt:
        type: string
    type: object
  domain.VisitStatus:
    enum:
    - scheduled
    - waiting
    - examining
    - completed
    - cancelled
    type: string
    x-enum-varnames:
    - Scheduled
    - Waiting
    - Examining
    - Completed
    - Cancelled
  dto.AddStockReq:
    properties:
      notes:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - quantity
    type: object
  dto.ClinicRequest:
    properties:
      address:
        type: string
      clinic_name:
        type: string
      email:
        type: string
      phone:
        type: string
      registration_no:
        type: string
      report_footer:
        type: string
      tagline:
        type: string
    required:
    - clinic_name
    - registration_no
    type: object
  dto.ClinicResponse:
    properties:
      address:
        type: string
      clinic_name:
        type: string
      email:
        type: string
      id:
        type: string
      phone:
        type: string
      registration_no:
        type: string
      report_footer:
        type: string
      tagline:
        type: string
      updated_by:
        type: string
    type: object
  dto.CreateInventoryItemReq:
    properties:
      brand:
        type: string
      category:
        enum:
        - frame
        - lens
        - contact_lens
        - sunglasses
        - coating
        - accessory
        - other
        type: string
      color:
        type: string
      cost_price:
        minimum: 0
        type: number
      model:
        type: string
      name:
        type: string
      quantity_on_hand:
        minimum: 0
        type: integer
      reorder_threshold:
        minimum: 0
        type: integer
      selling_price:
        minimum: 0
        type: number
      size:
        type: string
      sku:
        type: string
      unit:
        type: string
    required:
    - category
    - name
    - sku
    type: object
  dto.CreateInvoiceItemReq:
    properties:
      bundle_id:
        type: string
      description:
        type: string
      discount_amount:
        type: number
      inventory_item_id:
        type: string
      item_type:
        enum:
        - frame
        - lens
        - coating
        - contact_lens
        - service
        - other
        type: string
      quantity:
        minimum: 1
        type: integer
      unit_price:
        minimum: 0
        type: number
    required:
    - description
    - item_type
    - quantity
    - unit_price
    type: object
  dto.CreateInvoiceReq:
    properties:
      discount_amount:
        type: number
      items:
        items:
          $ref: '#/definitions/dto.CreateInvoiceItemReq'
        minItems: 1
        type: array
      patient_id:
        type: string
      tax_amount:
        type: number
      visit_id:
        type: string
    required:
    - items
    - patient_id
    type: object
  dto.CreateLabJobReq:
    properties:
      advance_payment:
        type: number
      expected_delivery_date:
        type: string
      invoice_id:
        type: string
      invoice_item_id:
        type: string
      job_type:
        type: string
      notes:
        type: string
      patient_id:
        type: string
      vendor_id:
        type: string
    required:
    - job_type
    - patient_id
    type: object
  dto.CreatePatientReq:
    properties:
      address:
        type: string
      dob:
        type: string
      email:
        type: string
      full_name:
        type: string
      gender:
        type: string
      occupation:
        type: string
      phone:
        type: string
    required:
    - dob
    - full_name
    - phone
    type: object
  dto.CreateRole:
    properties:
      role_name:
        type: string
    required:
    - role_name
    type: object
  dto.CreateStockPurchaseItemReq:
    properties:
      inventory_item_id:
        type: string
      quantity:
        minimum: 1
        type: integer
      unit_cost:
        minimum: 0
        type: number
    required:
    - inventory_item_id
    - quantity
    - unit_cost
    type: object
  dto.CreateStockPurchaseReq:
    properties:
      invoice_ref_no:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.CreateStockPurchaseItemReq'
        minItems: 1
        type: array
      paid_amount:
        type: number
      vendor_id:
        type: string
    required:
    - items
    - vendor_id
    type: object
  dto.CreateUser:
    properties:
      email:
        description: the acceptable string type is of email type
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      phone:
        type: string
      role_name:
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    - role_name
    type: object
  dto.CreateVendorReq:
    properties:
      address:
        type: string
      contact_person:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - name
    type: object
  dto.CreateVisitReq:
    properties:
      chief_complaint:
        type: string
      examine_by:
        type: string
      patient_id:
        type: string
      status:
        $ref: '#/definitions/domain.VisitStatus'
      visit_date:
        type: string
    required:
    - examine_by
    - patient_id
    type: object
  dto.DiagnosisCatalogResponse:
    properties:
      created_at:
        type: string
      icd10_code:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.EntityRef:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
